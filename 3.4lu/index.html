<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SnapSeek | Find the perfect image</title>
  <!-- Link to external stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Sticky header (Extra feature 1) -->
  <header class="sticky-header">
    <div class="header-container">
      <h1>SnapSeek</h1>
      <p class="tagline">Find the perfect image in seconds.</p>
      
      <!-- Search form with Enter-to-submit -->
      <form id="search-form">
        <label for="search-input" class="visually-hidden">Search for images</label>
        <input id="search-input" type="search" placeholder="Try 'mountains', 'neon city'..." aria-label="Search for images" required>
        <button type="submit" id="search-button">Search</button>
        <!-- Clear control (Extra feature 2) -->
        <button type="reset" id="clear-button">Clear</button>
      </form>
    </div>
  </header>

  <main>
    <!-- Result count placeholder -->
    <p id="result-count"></p>
    
    <!-- Empty results container waiting for JS -->
    <section id="results" class="image-grid"></section>
  </main>

  <!-- Link to external script right before closing body tag -->
  <script src="script.js"></script>
</body>
</html>
